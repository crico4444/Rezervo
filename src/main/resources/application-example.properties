spring.application.name=rezervari

# MySQL DataSource (implicit gol in WAMP; pune parola ta daca ai setat una)
spring.datasource.url=jdbc:mysql://localhost:3306/rezervari_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=false

# JWT (genereaza un sir aleator de minim 64 de caractere)
jwt.secret=PUNE_UN_SECRET_AICI
jwt.expiration=2592000000

# Server
server.port=8080

# Upload imagini
app.upload.dir=uploads
app.base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Email (Gmail SMTP): foloseste adresa ta si o parola de aplicatie Google
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=ADRESA_TA_GMAIL
spring.mail.password=PAROLA_DE_APLICATIE_AICI
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8